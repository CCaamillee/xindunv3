[theme]
base = "light"
primaryColor = "#0B5EA8"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#EEF3F7"
textColor = "#172B3A"
linkColor = "#0B5EA8"
borderColor = "#D8E1E8"
dataframeBorderColor = "#D8E1E8"
dataframeHeaderBackgroundColor = "#EAF1F6"
redColor = "#C93636"
orangeColor = "#B76513"
yellowColor = "#A47812"
greenColor = "#19734F"
blueColor = "#0B5EA8"
violetColor = "#7048B7"
grayColor = "#66788A"
chartCategoricalColors = ["#0B5EA8", "#19734F", "#B76513", "#7048B7", "#C93636", "#157A8A", "#66788A"]
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["34px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 650, 650, 600, 600]
linkUnderline = false

[client]
toolbarMode = "minimal"
showErrorDetails = "type"
disableDataExport = true

[server]
headless = true
fileWatcherType = "none"
